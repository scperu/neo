<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MED PRO | Estimulación Temprana</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --success: #10b981;
            --dark: #0f172a;
            --glass: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --card-radius: 24px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 20% 30%, #0f172a, #020617);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* responsive padding */
        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            transition: all 0.3s ease;
        }

        /* HEADER RESPONSIVE */
        .header-premium {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding: 16px 24px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.15), rgba(6, 182, 212, 0.1));
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-area h1 {
            font-size: clamp(22px, 6vw, 28px);
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a5b4fc, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .logo-area p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.2);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            white-space: nowrap;
        }

        /* SEARCH SECTION - FULL RESPONSIVE */
        .search-premium {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .search-wrapper {
            flex: 2;
            min-width: 200px;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            color: white;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.3);
        }

        .filter-wrapper {
            position: relative;
            min-width: 180px;
            flex: 1;
        }

        .filter-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            z-index: 1;
            font-size: 14px;
        }

        .filter-wrapper select {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            appearance: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-premium {
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            font-size: 14px;
            white-space: nowrap;
        }

        .btn-primary-premium {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-primary-premium:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        @media (max-width: 640px) {
            .search-premium {
                flex-direction: column;
            }
            .search-wrapper, .filter-wrapper, .btn-premium {
                width: 100%;
            }
            .btn-premium {
                justify-content: center;
            }
        }

        /* KPI CARDS - RESPONSIVE GRID */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            padding: 18px 20px;
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .kpi-icon {
            font-size: 28px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .kpi-label {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .kpi-number {
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            word-break: break-word;
        }

        /* TABLA RESPONSIVE: tarjetas en móvil */
        .table-premium {
            overflow: hidden;
            border-radius: 28px;
        }

        /* Para desktop: tabla normal */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 900px;
        }

        .data-table th {
            text-align: left;
            padding: 16px 16px;
            background: rgba(15, 23, 42, 0.8);
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
            vertical-align: middle;
        }

        .data-table tr:hover td {
            background: rgba(79, 70, 229, 0.1);
        }

        /* MODO MÓVIL: convertir tabla en tarjetas */
        @media (max-width: 768px) {
            .data-table,
            .data-table thead,
            .data-table tbody,
            .data-table th,
            .data-table td,
            .data-table tr {
                display: block;
            }

            .data-table thead {
                display: none; /* Ocultamos cabecera en móvil */
            }

            .data-table tr {
                margin-bottom: 16px;
                background: rgba(15, 23, 42, 0.6);
                border-radius: 20px;
                border: 1px solid var(--glass-border);
                padding: 12px;
                transition: all 0.2s;
            }

            .data-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                padding: 10px 8px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                font-size: 13px;
                text-align: right;
            }

            .data-table td:last-child {
                border-bottom: none;
            }

            /* Etiqueta que aparece antes del contenido */
            .data-table td::before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--text-secondary);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                background: rgba(255, 255, 255, 0.05);
                padding: 4px 8px;
                border-radius: 12px;
                display: inline-block;
                text-align: left;
                min-width: 100px;
            }

            /* Ajuste para botones de WhatsApp en móvil */
            .whatsapp-buttons {
                justify-content: flex-end;
            }
            
            .btn-wa {
                padding: 5px 10px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .data-table td {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
                gap: 8px;
            }
            .data-table td::before {
                width: 100%;
                margin-bottom: 4px;
                background: transparent;
                padding-left: 0;
            }
            .whatsapp-buttons {
                justify-content: flex-start;
                margin-top: 4px;
            }
        }

        .badge-gender {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge-m {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-f {
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .whatsapp-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .btn-wa {
            background: linear-gradient(135deg, #25D366, #128C7E);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .btn-wa:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        /* Paginación responsive */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 20px 16px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            padding: 8px 14px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 13px;
            min-width: 40px;
        }

        .page-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
        }

        .page-btn:hover:not(.active) {
            background: rgba(79, 70, 229, 0.3);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .page-btn {
                padding: 6px 10px;
                font-size: 11px;
                min-width: 34px;
            }
        }

        /* LOADING RESPONSIVE */
        .loading-premium {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.98);
            backdrop-filter: blur(16px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .loading-content {
            text-align: center;
            padding: 30px 24px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            width: 350px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(79, 70, 229, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 16px 0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .fade-in {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Ajustes generales para textos largos */
        .text-ellipsis {
            word-break: break-word;
        }

        .record-badge-mobile {
            display: inline-block;
        }
        
        @media (max-width: 480px) {
            .table-premium > div:first-child {
                font-size: 14px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .table-premium > div:first-child span:last-child {
                float: none;
                display: inline-block;
            }
        }
    </style>
</head>
<body>

<div class="loading-premium" id="loadingOverlay">
    <div class="loading-content">
        <div class="loader"></div>
        <div id="loadingText" style="color: var(--text-secondary); margin-bottom: 10px;">Conectando...</div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <div id="progressPercent" style="font-size: 12px; color: var(--text-secondary);">0%</div>
    </div>
</div>

<div class="container fade-in">
    <div class="header-premium">
        <div class="logo-area">
            <h1><i class="fas fa-baby-carriage"></i> MED PRO</h1>
            <p>Alta performance | <span id="recordCountSpan">0</span> pacientes registrados</p>
        </div>
        <div class="status-badge">
            <i class="fas fa-circle"></i>
            <span>Live</span>
        </div>
    </div>

    <div class="search-premium">
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Buscar por DNI, nombre, teléfono, dirección...">
        </div>
        <div class="filter-wrapper">
            <i class="fas fa-child"></i>
            <select id="ageGroupFilter">
                <option value="">Todos los pacientes</option>
                <option value="0-1">👶 Lacticopitos (Menores de 1 año)</option>
                <option value="1-2">🐰 Lacticonejitos (1 a 2 años)</option>
                <option value="2-3">🌈 Lactiarcoiris (2 a 3 años)</option>
                <option value="4-5">⭐ Lactiestrellitas (4 a 5 años)</option>
            </select>
        </div>
        <button class="btn-premium btn-primary-premium" id="refreshBtn"><i class="fas fa-sync-alt"></i> Actualizar</button>
    </div>

    <div class="kpi-grid">
        <div class="glass-card kpi-card">
            <div class="kpi-icon"><i class="fas fa-users"></i></div>
            <div class="kpi-label">PACIENTES ÚNICOS</div>
            <div class="kpi-number" id="totalPacientes">0</div>
        </div>
        <div class="glass-card kpi-card">
            <div class="kpi-icon"><i class="fas fa-calendar-check"></i></div>
            <div class="kpi-label">TOTAL ATENCIONES</div>
            <div class="kpi-number" id="totalAtenciones">0</div>
        </div>
        <div class="glass-card kpi-card">
            <div class="kpi-icon"><i class="fas fa-venus-mars"></i></div>
            <div class="kpi-label">MASCULINO / FEMENINO</div>
            <div class="kpi-number" id="totalGenero">0 / 0</div>
        </div>
    </div>

    <div class="glass-card table-premium">
        <div style="padding: 16px 20px 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
            <span style="font-weight: 600;"><i class="fas fa-table-list"></i> Registro de Pacientes</span>
            <span id="recordBadge" style="background: rgba(79,70,229,0.2); padding: 4px 12px; border-radius: 40px; font-size: 12px;"></span>
        </div>
        <div style="overflow-x: auto;">
            <table class="data-table" id="responsiveTable">
                <thead>
                    <tr>
                        <th>DNI</th>
                        <th>PACIENTE</th>
                        <th>FECHA NAC.</th>
                        <th>EDAD</th>
                        <th>SEXO</th>
                        <th>DIRECCIÓN</th>
                        <th>CONTACTO</th>
                        <th>FECHA ATENCIÓN</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="paginationContainer" class="pagination"></div>
    </div>
</div>

<script>
    // ========== CONFIGURACIÓN ==========
    const SHEET_ID = "19K_WVLpwPNbihNJGUnxl5TJczvYSK2b7xf2sYTlObDw";
    const SHEET_NAME = "bd_neo";
    const API_URL = `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;
    const ROWS_PER_PAGE = 50;
    let currentPage = 1;
    let allData = [];
    let filteredData = [];
    let searchDebounceTimer = null;

    // ========== FUNCIONES DE FECHA ==========
    function parseDateFromString(dateStr) {
        if (!dateStr) return null;
        let clean = dateStr.toString().replace(/[^\d\/\-]/g, '');
        let date = new Date(clean);
        if (!isNaN(date)) return date;
        let parts = clean.split(/[/-]/);
        if (parts.length === 3) {
            if (parts[0].length === 4) return new Date(parts[0], parts[1] - 1, parts[2]);
            else return new Date(parts[2], parts[1] - 1, parts[0]);
        }
        return null;
    }

    function calcularEdadEnMeses(fechaNacimiento) {
        if (!fechaNacimiento) return null;
        let fechaNac = parseDateFromString(fechaNacimiento);
        if (!fechaNac || isNaN(fechaNac)) return null;
        const hoy = new Date();
        let años = hoy.getFullYear() - fechaNac.getFullYear();
        let meses = hoy.getMonth() - fechaNac.getMonth();
        let días = hoy.getDate() - fechaNac.getDate();
        if (días < 0) {
            meses--;
            días += new Date(hoy.getFullYear(), hoy.getMonth(), 0).getDate();
        }
        if (meses < 0) {
            años--;
            meses += 12;
        }
        return (años * 12) + meses;
    }

    function calcularEdadDetallada(fechaNacimiento) {
        if (!fechaNacimiento) return '-';
        let fechaNac = parseDateFromString(fechaNacimiento);
        if (!fechaNac || isNaN(fechaNac)) return '-';
        const hoy = new Date();
        let años = hoy.getFullYear() - fechaNac.getFullYear();
        let meses = hoy.getMonth() - fechaNac.getMonth();
        let días = hoy.getDate() - fechaNac.getDate();
        if (días < 0) {
            meses--;
            días += new Date(hoy.getFullYear(), hoy.getMonth(), 0).getDate();
        }
        if (meses < 0) {
            años--;
            meses += 12;
        }
        const partes = [];
        if (años > 0) partes.push(`${años} año${años !== 1 ? 's' : ''}`);
        if (meses > 0) partes.push(`${meses} mes${meses !== 1 ? 'es' : ''}`);
        if (días > 0 && años === 0) partes.push(`${días} día${días !== 1 ? 's' : ''}`);
        return partes.length ? partes.join(' ') : '< 1 mes';
    }

    function formatearFecha(fecha) {
        if (!fecha) return '-';
        let date = parseDateFromString(fecha);
        return (date && !isNaN(date)) ? date.toLocaleDateString('es-PE') : '-';
    }

    function getSaludo() {
        const hora = new Date().getHours();
        if (hora >= 6 && hora < 12) return "Buenos días";
        if (hora >= 12 && hora < 19) return "Buenas tardes";
        return "Buenas noches";
    }

    function generarMensajeWhatsApp(nombrePaciente, edadMeses) {
        const saludo = getSaludo();
        if (edadMeses !== null && edadMeses >= 1 && edadMeses <= 33) {
            return `Hola ${saludo} Sr(a), me comunico con usted por su bebé *${nombrePaciente}* para brindarle cita para las sesiones de ESTIMULACIÓN TEMPRANA, los cuales se realizan los fines de semana específicamente por la mañana en horarios según su edad.`;
        } else if (edadMeses !== null && edadMeses >= 0 && edadMeses <= 24) {
            return `Hola ${saludo} Sr(a), me comunico con usted por su bebé *${nombrePaciente}* para brindarle CONSEJERÍA EN LACTANCIA MATERNA. Puede visitarnos en el Hospital II Essalud Huancavelica cuando presenta algún problema al AMAMANTAR A SU BEBÉ.`;
        }
        return "";
    }

    function extraerNumerosTelefono(texto) {
        if (!texto) return [];
        const numeros = new Set();
        const regex = /\b\d{9}\b/g;
        const matches = texto.match(regex);
        if (matches) {
            matches.forEach(num => {
                let limpio = num.replace(/[^\d]/g, '');
                if (limpio.length === 9 && limpio.startsWith('9')) limpio = '51' + limpio;
                numeros.add(limpio);
            });
        }
        const regexConGuion = /\d{9}/g;
        const matches2 = texto.match(regexConGuion);
        if (matches2) {
            matches2.forEach(num => {
                let limpio = num.replace(/[^\d]/g, '');
                if (limpio.length === 9 && limpio.startsWith('9')) limpio = '51' + limpio;
                if (limpio.length === 9) numeros.add('51' + limpio);
                else if (limpio.length >= 10) numeros.add(limpio);
            });
        }
        return Array.from(numeros);
    }

    function renderWhatsAppButtons(telefonoTexto, nombrePaciente, edadMeses) {
        const numeros = extraerNumerosTelefono(telefonoTexto);
        if (numeros.length === 0) return '<span style="color:#64748b;font-size:12px;">Sin contacto</span>';
        let html = '<div class="whatsapp-buttons">';
        numeros.forEach(num => {
            const numMostrar = num.slice(-9);
            const nombreEscapado = nombrePaciente.replace(/'/g, "\\'").replace(/"/g, '&quot;');
            html += `<button class="btn-wa" onclick="enviarWhatsApp('${num}', '${nombreEscapado}', ${edadMeses})">
                        <i class="fab fa-whatsapp"></i> ${numMostrar}
                     </button>`;
        });
        html += '</div>';
        return html;
    }

    window.enviarWhatsApp = function(telefono, nombrePaciente, edadMeses) {
        if (!telefono) {
            alert('No hay número de teléfono válido');
            return;
        }
        const mensaje = generarMensajeWhatsApp(nombrePaciente, edadMeses);
        let url = `https://wa.me/${telefono}`;
        if (mensaje && mensaje.trim() !== "") url += `?text=${encodeURIComponent(mensaje)}`;
        window.open(url, '_blank');
    };

    // ========== CARGA DE DATOS ==========
    async function fetchDataFromSheet() {
        const overlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        overlay.style.display = 'flex';
        progressBar.style.width = '0%';
        progressPercent.innerText = '0%';
        try {
            loadingText.innerHTML = '<i class="fas fa-cloud-download-alt"></i> Conectando...';
            progressBar.style.width = '20%';
            progressPercent.innerText = '20%';
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            const data = await response.json();
            if (!data || data.length === 0) throw new Error('No hay datos');
            loadingText.innerHTML = `<i class="fas fa-database"></i> Procesando ${data.length.toLocaleString()} registros...`;
            progressBar.style.width = '50%';
            progressPercent.innerText = '50%';
            const totalRows = data.length;
            let processedRows = 0;
            let tempData = [];
            for (let i = 0; i < totalRows; i += 500) {
                const batch = data.slice(i, i + 500);
                const processed = batch.map(row => {
                    const fechaNac = row.FECNACIMPACIENTE || '';
                    return {
                        dni: row.DNI || '',
                        paciente: row.PACIENTE || '',
                        fechaNac: fechaNac,
                        fechaNacFormateada: formatearFecha(fechaNac),
                        sexo: row.SEXO || '',
                        direccion: row.DIRECCION || '',
                        telefonos: row.TELEFONOS || '',
                        fechaAtencion: row.FECHA_ATENCION || '',
                        edadMeses: calcularEdadEnMeses(fechaNac),
                        edadDetallada: calcularEdadDetallada(fechaNac)
                    };
                }).filter(row => row.paciente || row.dni);
                tempData.push(...processed);
                processedRows += batch.length;
                const percent = 50 + Math.floor((processedRows / totalRows) * 40);
                progressBar.style.width = `${percent}%`;
                progressPercent.innerText = `${percent}%`;
                loadingText.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> Procesando ${processedRows.toLocaleString()} de ${totalRows.toLocaleString()}...`;
                await new Promise(resolve => setTimeout(resolve, 10));
            }
            allData = tempData;
            progressBar.style.width = '95%';
            progressPercent.innerText = '95%';
            loadingText.innerHTML = '<i class="fas fa-chart-line"></i> Indexando datos...';
            await new Promise(resolve => setTimeout(resolve, 50));
            document.getElementById('recordCountSpan').innerHTML = allData.length.toLocaleString();
            filteredData = [...allData];
            currentPage = 1;
            applyFiltersAndRender();
            progressBar.style.width = '100%';
            progressPercent.innerText = '100%';
            loadingText.innerHTML = '<i class="fas fa-check-circle"></i> ¡Listo!';
            setTimeout(() => overlay.style.display = 'none', 500);
        } catch (error) {
            console.error('Error:', error);
            loadingText.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error: ${error.message}`;
            setTimeout(() => overlay.style.display = 'none', 3000);
            document.getElementById('tableBody').innerHTML = `<tr><td colspan="8" style="text-align:center; padding:60px;"><i class="fas fa-link-broken"></i> Error de conexión. Verifica que la hoja sea pública.</td></tr>`;
        }
    }

    function applyFiltersAndRender() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
        const ageGroup = document.getElementById('ageGroupFilter').value;
        filteredData = allData.filter(item => {
            let matchesSearch = true;
            if (searchTerm) {
                matchesSearch = (item.dni?.toLowerCase().includes(searchTerm) ||
                               item.paciente?.toLowerCase().includes(searchTerm) ||
                               item.telefonos?.toLowerCase().includes(searchTerm) ||
                               item.direccion?.toLowerCase().includes(searchTerm));
            }
            let matchesAge = true;
            if (ageGroup && item.edadMeses !== null) {
                switch (ageGroup) {
                    case '0-1': matchesAge = item.edadMeses < 12; break;
                    case '1-2': matchesAge = item.edadMeses >= 12 && item.edadMeses < 24; break;
                    case '2-3': matchesAge = item.edadMeses >= 24 && item.edadMeses < 36; break;
                    case '4-5': matchesAge = item.edadMeses >= 48 && item.edadMeses < 72; break;
                    default: matchesAge = true;
                }
            }
            return matchesSearch && matchesAge;
        });
        currentPage = 1;
        renderTable();
        updateKPIs();
        renderPagination();
    }

    function renderTable() {
        const tbody = document.getElementById('tableBody');
        const start = (currentPage - 1) * ROWS_PER_PAGE;
        const end = start + ROWS_PER_PAGE;
        const pageData = filteredData.slice(start, end);
        if (!pageData.length) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; padding:60px;"><i class="fas fa-search"></i> No se encontraron resultados</td></tr>';
            document.getElementById('recordBadge').innerHTML = '0 registros';
            return;
        }
        let html = '';
        for (const item of pageData) {
            const genderClass = item.sexo === 'M' ? 'badge-m' : (item.sexo === 'F' ? 'badge-f' : '');
            const genderText = item.sexo === 'M' ? '<i class="fas fa-mars"></i> Masculino' : (item.sexo === 'F' ? '<i class="fas fa-venus"></i> Femenino' : (item.sexo || '-'));
            const whatsappButtons = renderWhatsAppButtons(item.telefonos, item.paciente, item.edadMeses);
            html += `<tr>
                        <td data-label="DNI">${item.dni || '-'}</td>
                        <td data-label="PACIENTE"><strong>${item.paciente || '-'}</strong></td>
                        <td data-label="FECHA NAC.">${item.fechaNacFormateada}</td>
                        <td data-label="EDAD">${item.edadDetallada}</td>
                        <td data-label="SEXO"><span class="badge-gender ${genderClass}">${genderText}</span></td>
                        <td data-label="DIRECCIÓN">${item.direccion || '-'}</td>
                        <td data-label="CONTACTO">${whatsappButtons}</td>
                        <td data-label="FECHA ATENCIÓN">${formatearFecha(item.fechaAtencion)}</td>
                    </tr>`;
        }
        tbody.innerHTML = html;
        document.getElementById('recordBadge').innerHTML = `${filteredData.length.toLocaleString()} registros (mostrando ${start+1}-${Math.min(end, filteredData.length)} de ${filteredData.length.toLocaleString()})`;
    }

    function updateKPIs() {
        const unique = new Set(filteredData.map(i => i.dni).filter(d => d));
        document.getElementById('totalPacientes').innerText = unique.size.toLocaleString();
        document.getElementById('totalAtenciones').innerText = filteredData.length.toLocaleString();
        const m = filteredData.filter(i => (i.sexo || '').toUpperCase() === 'M').length;
        const f = filteredData.filter(i => (i.sexo || '').toUpperCase() === 'F').length;
        document.getElementById('totalGenero').innerHTML = `${m.toLocaleString()} / ${f.toLocaleString()}`;
    }

    function renderPagination() {
        const totalPages = Math.ceil(filteredData.length / ROWS_PER_PAGE);
        const container = document.getElementById('paginationContainer');
        if (totalPages <= 1) { container.innerHTML = ''; return; }
        let html = `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;
        const maxVisible = 5;
        let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
        let endPage = Math.min(totalPages, startPage + maxVisible - 1);
        if (endPage - startPage + 1 < maxVisible) startPage = Math.max(1, endPage - maxVisible + 1);
        for (let i = startPage; i <= endPage; i++) html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
        html += `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
        container.innerHTML = html;
    }

    window.goToPage = function(page) {
        const totalPages = Math.ceil(filteredData.length / ROWS_PER_PAGE);
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        renderTable();
        renderPagination();
        document.querySelector('.table-premium')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };

    document.getElementById('searchInput').addEventListener('input', () => {
        if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
        searchDebounceTimer = setTimeout(() => applyFiltersAndRender(), 300);
    });
    document.getElementById('ageGroupFilter').addEventListener('change', () => applyFiltersAndRender());
    document.getElementById('refreshBtn').addEventListener('click', () => fetchDataFromSheet());

    fetchDataFromSheet();
</script>
</body>
</html>
