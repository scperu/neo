<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>MED PRO | Estimulación Temprana</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #06b6d4;
            --success: #10b981;
            --dark: #0f172a;
            --glass: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --card-radius: 24px;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(ellipse at 20% 30%, #0f172a, #020617);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--dark);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 12px;
            }
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--card-radius);
            transition: all 0.3s ease;
        }

        .header-premium {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 24px;
            padding: 16px 24px;
            background: linear-gradient(135deg, rgba(79, 70, 229, 0.15), rgba(6, 182, 212, 0.1));
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo-area h1 {
            font-size: clamp(22px, 6vw, 28px);
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #a5b4fc, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .logo-area p {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .status-badge {
            background: rgba(16, 185, 129, 0.2);
            padding: 6px 14px;
            border-radius: 40px;
            font-size: 12px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(16, 185, 129, 0.3);
            white-space: nowrap;
        }

        .search-premium {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .search-wrapper {
            flex: 2;
            min-width: 200px;
            position: relative;
        }

        .search-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 14px;
        }

        .search-wrapper input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            color: white;
            font-size: 14px;
            transition: all 0.3s;
        }

        .search-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 15px rgba(79, 70, 229, 0.3);
        }

        .filter-wrapper {
            position: relative;
            min-width: 180px;
            flex: 1;
        }

        .filter-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            z-index: 1;
            font-size: 14px;
        }

        .filter-wrapper select {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            appearance: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-premium {
            padding: 12px 24px;
            border-radius: 60px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            font-size: 14px;
            white-space: nowrap;
        }

        .btn-primary-premium {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }

        .btn-primary-premium:hover {
            transform: translateY(-2px);
            filter: brightness(1.05);
        }

        @media (max-width: 640px) {
            .search-premium {
                flex-direction: column;
            }
            .search-wrapper,
            .filter-wrapper,
            .btn-premium {
                width: 100%;
            }
            .btn-premium {
                justify-content: center;
            }
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            padding: 18px 20px;
            position: relative;
            overflow: hidden;
        }

        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .kpi-icon {
            font-size: 28px;
            margin-bottom: 10px;
            opacity: 0.8;
        }

        .kpi-label {
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .kpi-number {
            font-size: clamp(28px, 6vw, 42px);
            font-weight: 800;
            background: linear-gradient(135deg, #fff, #c7d2fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.1;
            word-break: break-word;
        }

        .table-premium {
            overflow: hidden;
            border-radius: 28px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        .data-table th {
            text-align: left;
            padding: 16px 16px;
            background: rgba(15, 23, 42, 0.8);
            font-weight: 600;
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table td {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 13px;
            vertical-align: middle;
        }

        .data-table tr:hover td {
            background: rgba(79, 70, 229, 0.1);
        }

        @media (max-width: 768px) {
            .data-table,
            .data-table thead,
            .data-table tbody,
            .data-table th,
            .data-table td,
            .data-table tr {
                display: block;
            }

            .data-table thead {
                display: none;
            }

            .data-table tr {
                margin-bottom: 16px;
                background: rgba(15, 23, 42, 0.6);
                border-radius: 20px;
                border: 1px solid var(--glass-border);
                padding: 12px;
                transition: all 0.2s;
            }

            .data-table td {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 12px;
                padding: 10px 8px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.05);
                font-size: 13px;
                text-align: right;
            }

            .data-table td:last-child {
                border-bottom: none;
            }

            .data-table td::before {
                content: attr(data-label);
                font-weight: 600;
                color: var(--text-secondary);
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
                background: rgba(255, 255, 255, 0.05);
                padding: 4px 8px;
                border-radius: 12px;
                display: inline-block;
                text-align: left;
                min-width: 100px;
            }

            .whatsapp-buttons {
                justify-content: flex-end;
            }

            .btn-wa,
            .btn-copy {
                padding: 5px 10px;
                font-size: 11px;
            }
        }

        @media (max-width: 480px) {
            .data-table td {
                flex-direction: column;
                align-items: flex-start;
                text-align: left;
                gap: 8px;
            }
            .data-table td::before {
                width: 100%;
                margin-bottom: 4px;
                background: transparent;
                padding-left: 0;
            }
            .whatsapp-buttons {
                justify-content: flex-start;
                margin-top: 4px;
            }
        }

        .badge-gender {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
            font-weight: 500;
            white-space: nowrap;
        }

        .badge-m {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .badge-f {
            background: rgba(236, 72, 153, 0.2);
            color: #f472b6;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .whatsapp-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-items: center;
        }

        .btn-wa {
            background: linear-gradient(135deg, #25D366, #128C7E);
            border: none;
            color: white;
            padding: 5px 10px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .btn-wa:hover {
            transform: scale(1.02);
            filter: brightness(1.1);
        }

        .btn-copy {
            background: rgba(79, 70, 229, 0.2);
            border: 1px solid rgba(79, 70, 229, 0.3);
            color: var(--text-primary);
            padding: 5px 8px;
            border-radius: 40px;
            cursor: pointer;
            font-size: 11px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .btn-copy:hover {
            background: rgba(79, 70, 229, 0.4);
            transform: scale(1.02);
        }

        .btn-copy.copied {
            background: rgba(16, 185, 129, 0.3);
            border-color: rgba(16, 185, 129, 0.5);
            color: #34d399;
        }

        .phone-number-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .phone-number-display {
            font-size: 11px;
            color: var(--text-secondary);
            margin-right: 2px;
            font-weight: 500;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding: 20px 16px;
            flex-wrap: wrap;
        }

        .page-btn {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--glass-border);
            padding: 8px 14px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
            font-size: 13px;
            min-width: 40px;
        }

        .page-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
        }

        .page-btn:hover:not(.active) {
            background: rgba(79, 70, 229, 0.3);
        }

        .page-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        @media (max-width: 550px) {
            .page-btn {
                padding: 6px 10px;
                font-size: 11px;
                min-width: 34px;
            }
        }

        .loading-premium {
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.98);
            backdrop-filter: blur(16px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 20px;
        }

        .loading-content {
            text-align: center;
            padding: 30px 24px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 48px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 90%;
            width: 350px;
        }

        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(79, 70, 229, 0.3);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        .progress-bar-container {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 16px 0;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .fade-in {
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .text-ellipsis {
            word-break: break-word;
        }

        .record-badge-mobile {
            display: inline-block;
        }

        @media (max-width: 480px) {
            .table-premium>div:first-child {
                font-size: 14px;
                flex-direction: column;
                align-items: flex-start;
                gap: 8px;
            }
            .table-premium>div:first-child span:last-child {
                float: none;
                display: inline-block;
            }
        }

        .phone-badge {
            display: inline-block;
            background: rgba(79, 70, 229, 0.15);
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(16, 185, 129, 0.95);
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 3000;
            pointer-events: none;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast i {
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Número copiado</span>
    </div>

    <div class="loading-premium" id="loadingOverlay">
        <div class="loading-content">
            <div class="loader"></div>
            <div id="loadingText" style="color: var(--text-secondary); margin-bottom: 10px;">Conectando...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div id="progressPercent" style="font-size: 12px; color: var(--text-secondary);">0%</div>
        </div>
    </div>

    <div class="container fade-in">
        <div class="header-premium">
            <div class="logo-area">
                <h1><i class="fas fa-baby-carriage"></i> MED PRO</h1>
                <p>Alta performance | <span id="recordCountSpan">0</span> pacientes únicos</p>
            </div>
            <div class="status-badge">
                <i class="fas fa-circle"></i>
                <span>Live</span>
            </div>
        </div>

        <div class="search-premium">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Buscar por DNI, nombre, teléfono, dirección...">
            </div>
            <div class="filter-wrapper">
                <i class="fas fa-child"></i>
                <select id="ageGroupFilter">
                    <option value="">Todos los pacientes</option>
                    <option value="0-1">👶 Lacticopitos (Menores de 1 año)</option>
                    <option value="1-2">🐰 Lacticonejitos (1 a 2 años)</option>

                </select>

            <button class="btn-premium btn-primary-premium" id="refreshBtn"><i class="fas fa-sync-alt"></i> Actualizar</button>
        </div>

        <div class="kpi-grid">
            <div class="glass-card kpi-card">
                <div class="kpi-icon"><i class="fas fa-users"></i></div>
                <div class="kpi-label">PACIENTES ÚNICOS</div>
                <div class="kpi-number" id="totalPacientes">0</div>
            </div>
            <div class="glass-card kpi-card">
                <div class="kpi-icon"><i class="fas fa-calendar-check"></i></div>
                <div class="kpi-label">TOTAL ATENCIONES</div>
                <div class="kpi-number" id="totalAtenciones">0</div>
            </div>
            <div class="glass-card kpi-card">
                <div class="kpi-icon"><i class="fas fa-venus-mars"></i></div>
                <div class="kpi-label">MASCULINO / FEMENINO</div>
                <div class="kpi-number" id="totalGenero">0 / 0</div>
            </div>
        </div>

        <div class="glass-card table-premium">
            <div style="padding: 16px 20px 0 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
                <span style="font-weight: 600;"><i class="fas fa-table-list"></i> Registro de Pacientes</span>
                <span id="recordBadge" style="background: rgba(79,70,229,0.2); padding: 4px 12px; border-radius: 40px; font-size: 12px;"></span>
            </div>
            <div style="overflow-x: auto;">
                <table class="data-table" id="responsiveTable">
                    <thead>
                        <tr>
                            <th>DNI</th>
                            <th>PACIENTE</th>
                            <th>FECHA NAC.</th>
                            <th>EDAD</th>
                            <th>SEXO</th>
                            <th>DIRECCIÓN</th>
                            <th>CONTACTO</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div id="paginationContainer" class="pagination"></div>
        </div>
    </div>

    <script>
        // ========== CONFIGURACIÓN ==========
        const SHEET_ID = "19K_WVLpwPNbihNJGUnxl5TJczvYSK2b7xf2sYTlObDw";
        const SHEET_NAME = "bd_neo";
        const API_URL = `https://opensheet.elk.sh/${SHEET_ID}/${SHEET_NAME}`;
        const ROWS_PER_PAGE = 50;
        let currentPage = 1;
        let allData = [];
        let filteredData = [];
        let searchDebounceTimer = null;

        // ========== TOAST ==========
        let toastTimeout = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            toast.classList.add('show');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // ========== FUNCIÓN COPIAR ==========
        window.copyToClipboard = function(text) {
            if (!text) return;
            // Limpiar el número (solo dígitos)
            const cleanNumber = text.replace(/\D/g, '');
            if (!cleanNumber) return;

            // Mostrar el número con + para el usuario
            const displayNumber = '+' + cleanNumber;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(displayNumber).then(() => {
                    showToast(`📋 ${displayNumber} copiado`);
                }).catch(() => {
                    fallbackCopy(displayNumber);
                });
            } else {
                fallbackCopy(displayNumber);
            }
        };

        function fallbackCopy(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToast(`📋 ${text} copiado`);
            } catch (e) {
                showToast('❌ Error al copiar');
            }
            document.body.removeChild(textarea);
        }

        // ========== FUNCIONES DE FECHA ==========
        function parseDateFromString(dateStr) {
            if (!dateStr) return null;
            const clean = dateStr.toString().trim();
            const parts = clean.split(/[/-]/);
            if (parts.length !== 3) return null;

            let day, month, year;
            if (parts[0].length === 4) {
                year = parseInt(parts[0], 10);
                month = parseInt(parts[1], 10) - 1;
                day = parseInt(parts[2], 10);
            } else {
                day = parseInt(parts[0], 10);
                month = parseInt(parts[1], 10) - 1;
                year = parseInt(parts[2], 10);
            }

            if (isNaN(day) || isNaN(month) || isNaN(year)) return null;
            const date = new Date(year, month, day);
            if (date.getFullYear() === year && date.getMonth() === month && date.getDate() === day) {
                return date;
            }
            return null;
        }

        function calcularEdadEnMeses(fechaNacimiento) {
            if (!fechaNacimiento) return null;
            let fechaNac = parseDateFromString(fechaNacimiento);
            if (!fechaNac || isNaN(fechaNac)) return null;
            const hoy = new Date();
            let años = hoy.getFullYear() - fechaNac.getFullYear();
            let meses = hoy.getMonth() - fechaNac.getMonth();
            let días = hoy.getDate() - fechaNac.getDate();
            if (días < 0) {
                meses--;
                días += new Date(hoy.getFullYear(), hoy.getMonth(), 0).getDate();
            }
            if (meses < 0) {
                años--;
                meses += 12;
            }
            return (años * 12) + meses;
        }

        function calcularEdadDetallada(fechaNacimiento) {
            if (!fechaNacimiento) return '-';
            let fechaNac = parseDateFromString(fechaNacimiento);
            if (!fechaNac || isNaN(fechaNac)) return '-';
            const hoy = new Date();
            let años = hoy.getFullYear() - fechaNac.getFullYear();
            let meses = hoy.getMonth() - fechaNac.getMonth();
            let días = hoy.getDate() - fechaNac.getDate();
            if (días < 0) {
                meses--;
                días += new Date(hoy.getFullYear(), hoy.getMonth(), 0).getDate();
            }
            if (meses < 0) {
                años--;
                meses += 12;
            }
            const partes = [];
            if (años > 0) partes.push(`${años} año${años !== 1 ? 's' : ''}`);
            if (meses > 0) partes.push(`${meses} mes${meses !== 1 ? 'es' : ''}`);
            if (días > 0 && años === 0) partes.push(`${días} día${días !== 1 ? 's' : ''}`);
            return partes.length ? partes.join(' ') : '< 1 mes';
        }

        function formatearFecha(fecha) {
            if (!fecha) return '-';
            let date = parseDateFromString(fecha);
            if (date && !isNaN(date)) {
                const dia = String(date.getDate()).padStart(2, '0');
                const mes = String(date.getMonth() + 1).padStart(2, '0');
                const anio = date.getFullYear();
                return `${dia}/${mes}/${anio}`;
            }
            return '-';
        }

        function getSaludo() {
            const hora = new Date().getHours();
            if (hora >= 6 && hora < 12) return "Buenos días";
            if (hora >= 12 && hora < 19) return "Buenas tardes";
            return "Buenas noches";
        }

        function generarMensajeWhatsApp(nombrePaciente, edadMeses) {
            const saludo = getSaludo();
            if (edadMeses !== null && edadMeses >= 1 && edadMeses <= 33) {
                return `Hola ${saludo} Sr(a), me comunico con usted por su bebé *${nombrePaciente}* para brindarle cita para las sesiones de ESTIMULACIÓN TEMPRANA, los cuales se realizan los fines de semana específicamente por la mañana en horarios según su edad.`;
            } else if (edadMeses !== null && edadMeses >= 0 && edadMeses <= 24) {
                return `Hola ${saludo} Sr(a), me comunico con usted por su bebé *${nombrePaciente}* para brindarle CONSEJERÍA EN LACTANCIA MATERNA. Puede visitarnos en el Hospital II Essalud Huancavelica cuando presenta algún problema al AMAMANTAR A SU BEBÉ.`;
            }
            return "";
        }

        function extraerNumerosTelefono(texto) {
            if (!texto) return [];
            const numeros = new Set();
            // Buscar números de 9 dígitos
            const regex = /\b\d{9}\b/g;
            const matches = texto.match(regex);
            if (matches) {
                matches.forEach(num => {
                    let limpio = num.replace(/[^\d]/g, '');
                    if (limpio.length === 9 && limpio.startsWith('9')) limpio = '51' + limpio;
                    numeros.add(limpio);
                });
            }
            // Buscar números con guiones o espacios
            const regexConGuion = /\d{9}/g;
            const matches2 = texto.match(regexConGuion);
            if (matches2) {
                matches2.forEach(num => {
                    let limpio = num.replace(/[^\d]/g, '');
                    if (limpio.length === 9 && limpio.startsWith('9')) limpio = '51' + limpio;
                    if (limpio.length === 9) numeros.add('51' + limpio);
                    else if (limpio.length >= 10) numeros.add(limpio);
                });
            }
            return Array.from(numeros);
        }

        function renderWhatsAppButtons(telefonoTexto, nombrePaciente, edadMeses) {
            const numeros = extraerNumerosTelefono(telefonoTexto);
            if (numeros.length === 0) return '<span style="color:#64748b;font-size:12px;">Sin contacto</span>';

            let html = '<div class="whatsapp-buttons">';
            numeros.forEach(num => {
                // Mostrar el número con +51 o + según corresponda
                const numDisplay = '+' + num;
                const numMostrar = num.slice(-9);
                const nombreEscapado = nombrePaciente.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                html += `
                            <div class="phone-number-wrapper">
                                <button class="btn-wa" onclick="enviarWhatsApp('${num}', '${nombreEscapado}', ${edadMeses})">
                                    <i class="fab fa-whatsapp"></i> ${numMostrar}
                                </button>
                                <button class="btn-copy" onclick="copyToClipboard('${num}')" title="Copiar número">
                                    <i class="fas fa-copy"></i>
                                </button>
                            </div>
                        `;
            });
            html += '</div>';
            return html;
        }

        window.enviarWhatsApp = function(telefono, nombrePaciente, edadMeses) {
            if (!telefono) {
                alert('No hay número de teléfono válido');
                return;
            }
            const mensaje = generarMensajeWhatsApp(nombrePaciente, edadMeses);
            // Asegurar que el número tenga el código de país
            let numeroCompleto = telefono;
            if (!numeroCompleto.startsWith('51') && numeroCompleto.length === 9) {
                numeroCompleto = '51' + numeroCompleto;
            }
            let url = `https://wa.me/${numeroCompleto}`;
            if (mensaje && mensaje.trim() !== "") url += `?text=${encodeURIComponent(mensaje)}`;
            window.open(url, '_blank');
        };

        // ========== CARGA DE DATOS CON DEDUPLICACIÓN ==========
        async function fetchDataFromSheet() {
            const overlay = document.getElementById('loadingOverlay');
            const loadingText = document.getElementById('loadingText');
            const progressBar = document.getElementById('progressBar');
            const progressPercent = document.getElementById('progressPercent');
            overlay.style.display = 'flex';
            progressBar.style.width = '0%';
            progressPercent.innerText = '0%';
            try {
                loadingText.innerHTML = '<i class="fas fa-cloud-download-alt"></i> Conectando...';
                progressBar.style.width = '20%';
                progressPercent.innerText = '20%';
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();
                if (!data || data.length === 0) throw new Error('No hay datos');
                loadingText.innerHTML = `<i class="fas fa-database"></i> Procesando ${data.length.toLocaleString()} registros...`;
                progressBar.style.width = '50%';
                progressPercent.innerText = '50%';

                const pacientesMap = new Map();

                for (let i = 0; i < data.length; i++) {
                    const row = data[i];
                    const dni = (row.DNI || '').trim();
                    if (!dni) continue;

                    const fechaNac = row.FECNACIMPACIENTE || '';
                    const fechaAtencion = row.FECHA_ATENCION || '';

                    if (pacientesMap.has(dni)) {
                        const existing = pacientesMap.get(dni);
                        if (fechaAtencion && (!existing.fechaAtencion || fechaAtencion > existing.fechaAtencion)) {
                            existing.fechaAtencion = fechaAtencion;
                        }
                        if (row.TELEFONOS) {
                            const existingPhones = existing.telefonos || '';
                            if (!existingPhones.includes(row.TELEFONOS)) {
                                existing.telefonos = existingPhones ? `${existingPhones}, ${row.TELEFONOS}` : row
                                    .TELEFONOS;
                            }
                        }
                        continue;
                    }

                    const paciente = {
                        dni: dni,
                        paciente: row.PACIENTE || '',
                        fechaNac: fechaNac,
                        fechaNacFormateada: formatearFecha(fechaNac),
                        sexo: row.SEXO || '',
                        direccion: row.DIRECCION || '',
                        telefonos: row.TELEFONOS || '',
                        fechaAtencion: fechaAtencion,
                        edadMeses: calcularEdadEnMeses(fechaNac),
                        edadDetallada: calcularEdadDetallada(fechaNac)
                    };
                    pacientesMap.set(dni, paciente);

                    if (i % 100 === 0) {
                        const percent = 50 + Math.floor((i / data.length) * 40);
                        progressBar.style.width = `${percent}%`;
                        progressPercent.innerText = `${percent}%`;
                        loadingText.innerHTML =
                            `<i class="fas fa-spinner fa-pulse"></i> Procesando ${i.toLocaleString()} de ${data.length.toLocaleString()}...`;
                        await new Promise(resolve => setTimeout(resolve, 10));
                    }
                }

                allData = Array.from(pacientesMap.values());
                progressBar.style.width = '95%';
                progressPercent.innerText = '95%';
                loadingText.innerHTML = '<i class="fas fa-chart-line"></i> Indexando datos...';
                await new Promise(resolve => setTimeout(resolve, 50));

                document.getElementById('recordCountSpan').innerHTML = allData.length.toLocaleString();
                filteredData = [...allData];
                currentPage = 1;
                applyFiltersAndRender();

                progressBar.style.width = '100%';
                progressPercent.innerText = '100%';
                loadingText.innerHTML = '<i class="fas fa-check-circle"></i> ¡Listo!';
                setTimeout(() => overlay.style.display = 'none', 500);

            } catch (error) {
                console.error('Error:', error);
                loadingText.innerHTML = `<i class="fas fa-exclamation-triangle"></i> Error: ${error.message}`;
                setTimeout(() => overlay.style.display = 'none', 3000);
                document.getElementById('tableBody').innerHTML =
                    `<tr><td colspan="7" style="text-align:center; padding:60px;"><i class="fas fa-link-broken"></i> Error de conexión. Verifica que la hoja sea pública.</td></tr>`;
            }
        }

        function applyFiltersAndRender() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const ageGroup = document.getElementById('ageGroupFilter').value;
            filteredData = allData.filter(item => {
                let matchesSearch = true;
                if (searchTerm) {
                    matchesSearch = (item.dni?.toLowerCase().includes(searchTerm) ||
                        item.paciente?.toLowerCase().includes(searchTerm) ||
                        item.telefonos?.toLowerCase().includes(searchTerm) ||
                        item.direccion?.toLowerCase().includes(searchTerm));
                }
                let matchesAge = true;
                if (ageGroup && item.edadMeses !== null) {
                    switch (ageGroup) {
                        case '0-1':
                            matchesAge = item.edadMeses < 12;
                            break;
                        case '1-2':
                            matchesAge = item.edadMeses >= 12 && item.edadMeses < 24;
                            break;
                        case '2-3':
                            matchesAge = item.edadMeses >= 24 && item.edadMeses < 36;
                            break;
                        case '4-5':
                            matchesAge = item.edadMeses >= 48 && item.edadMeses < 72;
                            break;
                        default:
                            matchesAge = true;
                    }
                }
                return matchesSearch && matchesAge;
            });
            currentPage = 1;
            renderTable();
            updateKPIs();
            renderPagination();
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const start = (currentPage - 1) * ROWS_PER_PAGE;
            const end = start + ROWS_PER_PAGE;
            const pageData = filteredData.slice(start, end);
            if (!pageData.length) {
                tbody.innerHTML =
                    '<tr><td colspan="7" style="text-align:center; padding:60px;"><i class="fas fa-search"></i> No se encontraron resultados</td></tr>';
                document.getElementById('recordBadge').innerHTML = '0 registros';
                return;
            }
            let html = '';
            for (const item of pageData) {
                const genderClass = item.sexo === 'M' ? 'badge-m' : (item.sexo === 'F' ? 'badge-f' : '');
                const genderText = item.sexo === 'M' ? '<i class="fas fa-mars"></i> Masculino' : (item.sexo === 'F' ?
                    '<i class="fas fa-venus"></i> Femenino' : (item.sexo || '-'));
                const whatsappButtons = renderWhatsAppButtons(item.telefonos, item.paciente, item.edadMeses);
                html += `<tr>
                            <td data-label="DNI">${item.dni || '-'}</td>
                            <td data-label="PACIENTE"><strong>${item.paciente || '-'}</strong></td>
                            <td data-label="FECHA NAC.">${item.fechaNacFormateada}</td>
                            <td data-label="EDAD">${item.edadDetallada}</td>
                            <td data-label="SEXO"><span class="badge-gender ${genderClass}">${genderText}</span></td>
                            <td data-label="DIRECCIÓN">${item.direccion || '-'}</td>
                            <td data-label="CONTACTO">${whatsappButtons}</td>
                         </tr>`;
            }
            tbody.innerHTML = html;
            document.getElementById('recordBadge').innerHTML =
                `${filteredData.length.toLocaleString()} registros (mostrando ${start+1}-${Math.min(end, filteredData.length)} de ${filteredData.length.toLocaleString()})`;
        }

        function updateKPIs() {
            document.getElementById('totalPacientes').innerText = filteredData.length.toLocaleString();
            document.getElementById('totalAtenciones').innerText = filteredData.length.toLocaleString();
            const m = filteredData.filter(i => (i.sexo || '').toUpperCase() === 'M').length;
            const f = filteredData.filter(i => (i.sexo || '').toUpperCase() === 'F').length;
            document.getElementById('totalGenero').innerHTML = `${m.toLocaleString()} / ${f.toLocaleString()}`;
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredData.length / ROWS_PER_PAGE);
            const container = document.getElementById('paginationContainer');
            if (totalPages <= 1) { container.innerHTML = ''; return; }
            let html =
                `<button class="page-btn" onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);
            if (endPage - startPage + 1 < maxVisible) startPage = Math.max(1, endPage - maxVisible + 1);
            for (let i = startPage; i <= endPage; i++) html +=
                `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
            html +=
                `<button class="page-btn" onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
            container.innerHTML = html;
        }

        window.goToPage = function(page) {
            const totalPages = Math.ceil(filteredData.length / ROWS_PER_PAGE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            renderPagination();
            document.querySelector('.table-premium')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
        };

        document.getElementById('searchInput').addEventListener('input', () => {
            if (searchDebounceTimer) clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => applyFiltersAndRender(), 300);
        });
        document.getElementById('ageGroupFilter').addEventListener('change', () => applyFiltersAndRender());
        document.getElementById('refreshBtn').addEventListener('click', () => fetchDataFromSheet());

        fetchDataFromSheet();
    </script>
</body>
</html>
